name: pipeline

on:
  schedule:
    - cron: "*/30 * * * *"        # incremental run every 30 minutes
  workflow_dispatch:               # manual run from the Actions tab (used in the live demo)
    inputs:
      command:
        description: "run | backfill"
        default: run
      start:
        description: "backfill start, YYYY-MM-DD"
        default: ""
      end:
        description: "backfill end, YYYY-MM-DD"
        default: ""
      inject_bad:
        description: "demo: inject an invalid record (quality gate must block it)"
        type: boolean
        default: false
      break_source:
        description: "demo: simulate outage of usgs or emsc"
        default: ""
      test_alert:
        description: "send a test Telegram message (checks the bot secrets)"
        type: boolean
        default: false

concurrency:                       # never two runs writing the lake at the same time
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Checkout data lake (branch `data`)
        uses: actions/checkout@v5
        with:
          ref: data
          path: data

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Unit tests of transformation logic
        run: pytest -q tests

      - name: Test Telegram alert
        if: inputs.test_alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m quake test-alert

      - name: Run pipeline
        id: pipe
        env:
          QUAKE_DATA_DIR: data
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          if [ "${{ inputs.command }}" = "backfill" ]; then
            python -m quake backfill --start "${{ inputs.start }}" --end "${{ inputs.end }}"
          else
            ARGS="--mode scheduled"
            [ "${{ github.event_name }}" = "workflow_dispatch" ] && ARGS="--mode manual"
            [ "${{ inputs.inject_bad }}" = "true" ] && ARGS="$ARGS --inject-bad"
            [ -n "${{ inputs.break_source }}" ] && ARGS="$ARGS --break-source ${{ inputs.break_source }}"
            python -m quake run $ARGS
          fi
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Commit lake (raw + stage + final + serve + run log)
        run: |
          cd data
          git config user.name  "quake-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "data: ${{ github.event_name }} run $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing to commit"
          git push -q origin HEAD:data

      - name: Fail the job if the pipeline failed (shows red in Actions)
        if: steps.pipe.outputs.code != '0'
        run: exit 1
